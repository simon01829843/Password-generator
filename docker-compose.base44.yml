services:
  web:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    environment:
      - BASE44_PREVIEW_MODE=${BASE44_PREVIEW_MODE:-0}
      - PYTHONUNBUFFERED=1
    command: ["sh", "-ec", "pip install --quiet --no-cache-dir -r requirements.txt && exec python app.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: on-failure
